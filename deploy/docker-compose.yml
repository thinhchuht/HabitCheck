services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: habit
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Database=habit;Username=habit;Password=${DB_PASSWORD}
      Google__ClientId: ${GOOGLE_CLIENT_ID}
      Jwt__Secret: ${JWT_SECRET}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}
      Cloudinary__ProofPreset: ${CLOUDINARY_PROOF_PRESET:-habit_proof_signed}
      Cloudinary__AvatarPreset: ${CLOUDINARY_AVATAR_PRESET:-habit_avatar_signed}
      App__TimeZone: Asia/Ho_Chi_Minh
      App__CorsOrigin: ${FRONTEND_URL:-http://localhost:8080}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: /api
        VITE_HUB_URL: /hubs/live
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
