# Render Blueprint — Habit Check-in backend (API + Postgres), free tier.
# Deploy: render.com (đăng nhập bằng GitHub) → New → Blueprint → chọn repo này.
# Các env `sync: false` phải điền giá trị trong Render dashboard (Settings → Environment).
services:
  - type: web
    name: habit-checkin-api
    runtime: docker
    plan: free
    dockerContext: apps/api
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render PG trả connection string dạng URI (postgresql://...?sslmode=require)
      # — app tự chuẩn hoá về keyword=value (PostgresConnectionString.Normalize).
      - key: ConnectionStrings__Default
        fromDatabase:
          name: habit-db
          property: connectionString
      - key: Google__ClientId
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__ProofPreset
        value: habit_proof_signed
      - key: Cloudinary__AvatarPreset
        value: habit_avatar_signed
      - key: Admin__Username
        value: thinhchuht
      - key: Admin__Password
        sync: false
      # CORS: dev local (Vite proxy) + static site production (cùng site onrender.com
      # nên refresh cookie SameSite=Strict vẫn gửi được).
      - key: App__CorsOrigin
        value: http://localhost:5173,https://habit-checkin-web.onrender.com
      - key: App__TimeZone
        value: Asia/Ho_Chi_Minh
      - key: TZ
        value: Asia/Ho_Chi_Minh

  # Frontend — static site (build Vite). Cùng site *.onrender.com với API nên
  # refresh cookie SameSite=Strict vẫn hoạt động, không cần đổi cấu hình cookie.
  - type: web
    name: habit-checkin-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      # Vite 5 cần Node >= 18.
      - key: NODE_VERSION
        value: "20"
      # Build-time (inline vào bundle) — trỏ về API đã deploy.
      # KHÔNG quên hậu tố /api: client dùng làm baseURL, path gộp thêm sau đó.
      - key: VITE_API_URL
        value: https://habit-checkin-api.onrender.com/api
      - key: VITE_HUB_URL
        value: https://habit-checkin-api.onrender.com/hubs/live
      - key: VITE_GOOGLE_CLIENT_ID
        value: 795347854507-4dnj9k43692j58q9nihvfbogtbbjft27.apps.googleusercontent.com

databases:
  - name: habit-db
    plan: free
